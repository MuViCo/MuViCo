# Garage configuration for the bundled local development S3 service.
# Only meant for `compose.yaml` (development); never reuse this for production.
#
# Secrets (rpc_secret, admin_token) are intentionally not stored here: they are
# passed through the GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN environment
# variables in compose.yaml, which keeps this file free of credentials.
# See https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Single node, so no replication is possible.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
